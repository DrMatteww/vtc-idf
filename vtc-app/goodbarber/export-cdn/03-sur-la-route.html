<!-- =========================================================================
     VTC IDF — section « Sur la route »
     À COLLER DANS GOODBARBER : section de type « Custom » / contenu HTML.
     Le style et la logique sont appelés depuis l'adresse publique : corriger
     un bug plus tard ne demandera pas de recoller cette section.
     Rien à modifier ici.
     ========================================================================= -->
<!-- ===========================================================
     ONGLET 3 — SUR LA ROUTE
     Toilettes, Manger, Trafic, Astuces.

     Cette section est volontairement VIDE de logique : tout est
     dans app.js, sur l'adresse publique. C'est ce qui permet de
     corriger un bug ou d'ajouter un filtre sans jamais recoller
     cette section ni republier l'application.

     Rien à modifier ici.
     =========================================================== -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://drmatteww.github.io/vtc-idf/app.css">
<style>
  /* Filet de sécurité si le CDN ne répond pas : on reste lisible et sombre. */
  body { background:#0A0A0B; color:#F4F4F5; margin:0;
         font-family:Barlow,-apple-system,BlinkMacSystemFont,Roboto,sans-serif; }
</style>

<div id="surlaroute">
  <div class="stack"><div class="skeleton"></div><div class="skeleton"></div></div>
</div>
<script>window.__VTC_BASE = 'https://drmatteww.github.io/vtc-idf/data/';</script>
<script src="https://drmatteww.github.io/vtc-idf/app.js"></script>
<script>
  /* Trois cas où VTC.route n'existe pas : le réseau est coupé, l'adresse
     publique ne répond pas, ou cette section a été collée avant que le
     nouvel app.js ne soit publié. Dans les trois, on le DIT au lieu de
     laisser un écran gris qui ne charge jamais. */
  if (window.VTC && VTC.route) {
    VTC.route('surlaroute');
  } else {
    document.getElementById('surlaroute').innerHTML =
      '<div class="empty"><span class="empty__ico">\uD83D\uDCE1</span>' +
      '<p class="empty__title">Chargement impossible</p>' +
      '<p>Reviens dès que tu as du réseau. Si ça dure, c\'est que la ' +
      'mise à jour n\'est pas encore en ligne.</p></div>';
  }
</script>
