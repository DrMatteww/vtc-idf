<!-- =========================================================================
     VTC IDF — section « Brief »
     À COLLER DANS GOODBARBER : section de type « Custom » / contenu HTML.
     Le style et la logique sont appelés depuis l'adresse publique : corriger
     un bug plus tard ne demandera pas de recoller cette section.
     Rien à modifier ici.
     ========================================================================= -->
<!-- ===========================================================
     ONGLET 1 — BRIEF  (section « Custom / HTML » GoodBarber)
     Le titre suit l'heure d'ouverture : Ce matin / Ce midi /
     Cet après-midi / Ce soir / Cette nuit.
     Tient sur un écran sans défilement : 3 blocs maximum.
     =========================================================== -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://drmatteww.github.io/vtc-idf/app.css">
<style>
  /* Filet de sécurité si le CDN ne répond pas : on reste lisible et sombre. */
  body { background:#0A0A0B; color:#F4F4F5; margin:0;
         font-family:Barlow,-apple-system,BlinkMacSystemFont,Roboto,sans-serif; }
</style>

<div class="topbar">
  <div class="topbar__left">
    <h1 class="topbar__period" id="period">…</h1>
    <div class="topbar__meta">
      <span class="dot" id="dot"></span>
      <span id="meta">chargement</span>
    </div>
  </div>
  <div id="meteo"></div>
</div>

<div class="filters" id="scope"></div>

<div class="stack" id="stack">
  <div class="skeleton"></div>
  <div class="skeleton" style="height:70px"></div>
</div>
<script>window.__VTC_BASE = 'https://drmatteww.github.io/vtc-idf/data/';</script>
<script src="https://drmatteww.github.io/vtc-idf/app.js"></script>
<script>
(function () {
  'use strict';

  // ⚠️ À remplir avec le lien interne que GoodBarber génère pour la section
  // « Sur la route », suivi de « #trafic » : la carte rouge « Attention »
  // ouvre alors directement la liste des fermetures. Laissé vide, la carte
  // reste affichée, simplement non cliquable — jamais cassée. La
  // prévisualisation le remplit toute seule.
  var GOTO_TRAFIC = (window.__VTC_GOTO || {}).trafic || '';

  var now    = new Date();
  var per    = VTC.period(now);
  var stack  = document.getElementById('stack');

  document.getElementById('period').textContent = per.label;

  /* Deux briefs : toute l'Île-de-France, ou ce qui est à moins de 10 km.
     **Si la position a déjà été accordée, c'est le brief perso qui s'ouvre**,
     sans rien toucher : un chauffeur qui lance l'app veut voir son secteur,
     pas la région. Toute l'Île-de-France reste à un clic, juste au-dessus.
     Tant que la position n'a jamais été donnée — ou qu'elle a été refusée —
     on ouvre sur l'IDF : atterrir sur « position bloquée » à chaque fois
     serait le plus sûr moyen de faire désinstaller l'app.                  */
  var scope = VTC.geoKnown() === 'ok' ? 'near' : 'idf';
  var choixManuel = 0;          // quand le chauffeur a choisi lui-même

  var donnees = null, pos = null, geoErr = null, geoAsked = false;

  /* La position est relue à CHAQUE ouverture, jamais mémorisée : seul le
     choix de la pastille l'est. On peut fermer l'app à Orly et la rouvrir
     dans Paris, le secteur suit.                                           */
  function situer(apres) {
    geoAsked = true;
    VTC.locate(function (err, p) {
      geoErr = err;
      if (p) pos = p;
      if (apres) apres();
    }, 0);
  }

  /* Retour dans l'application : on revient au brief perso, comme à l'ouverture
     — sauf si le chauffeur vient justement de demander toute l'Île-de-France.
     Lui reprendre son choix pendant qu'il le lit serait désagréable.      */
  VTC.onReopen(function () {
    if (VTC.geoKnown() === 'ok' && Date.now() - choixManuel > 10 * 60000 &&
        scope !== 'near') {
      scope = 'near';
      VTC.setActiveChip(document.getElementById('scope'), scope);
    }
    if (scope === 'near') situer(render);
  });

  VTC.renderChips(document.getElementById('scope'), [
    { code: 'idf',  label: 'Toute l\'IDF' },
    { code: 'near', label: 'Autour de moi' }
  ], scope, function (c) {
    scope = c;
    choixManuel = Date.now();
    if (c === 'near') {
      stack.innerHTML = '<div class="skeleton"></div>';
      situer(render);
      return;
    }
    render();
  });

  VTC.load('brief', function (err, data, cached) {
    if (err || !data) {
      document.getElementById('meta').textContent = 'données indisponibles';
      document.getElementById('dot').className = 'dot dot--stale';
      stack.innerHTML =
        '<div class="empty"><span class="empty__ico">📡</span>' +
        '<p class="empty__title">Pas de connexion</p>' +
        '<p>Le brief s\'affichera dès que le réseau revient.</p></div>';
      return;
    }

    var fresh = VTC.freshness(data.generated_at, cached);
    document.getElementById('meta').textContent = VTC.dayLabel(now) + ' · ' + fresh.text;
    document.getElementById('dot').className = 'dot' + (fresh.stale ? ' dot--stale' : '');

    donnees = data;
    if (scope === 'near' && !geoAsked) {
      situer(render);
      return;
    }
    render();
  });

  function render() {
    var data = donnees;
    if (!data) return;

    /* La météo suit le brief : le point le plus proche quand on regarde son
       secteur, Paris pour toute l'Île-de-France. Elle est dans le même
       fichier, donc rien à télécharger de plus. Posée avant les retours
       anticipés : même écran « position bloquée », on garde le ciel.      */
    document.getElementById('meteo').innerHTML = VTC.meteoHtml(
      VTC.meteoNow(data.meteo, scope === 'near' ? pos : null));

    /* En mode « autour de moi » on ne garde que ce qui est à portée. Un
       élément sans coordonnées est écarté : c'est le cas d'une fermeture dont
       la description ne nomme aucun lieu géocodable.                        */
    var local = scope === 'near' && pos;
    /* VTC.live écarte ce qui est fini et les arrivées d'après 6 h demain :
       le brief parle de la journée en cours, pas du TGV de mardi.         */
    var demand = VTC.live(local ? VTC.near(data.demand, pos).list : (data.demand || []));
    var toutesFerm = local ? VTC.near(data.closures, pos).list : (data.closures || []);
    var html = '';

    /* Sans position, on n'affiche QUE l'explication. Montrer le brief de
       toute l'Île-de-France à la place serait pire que rien : on croirait
       lire son propre secteur.                                             */
    if (scope === 'near' && !pos) {
      if (!geoErr) {
        stack.innerHTML = '<div class="card"><div class="card__label">Autour de moi</div>' +
          '<p class="card__title">Recherche de ta position…</p></div>';
        return;
      }
      stack.innerHTML =
        '<div class="card card--alert">' +
          '<div class="card__label">Position bloquée</div>' +
          '<p class="card__title">' + VTC.esc(VTC.geoMessage(geoErr)) + '</p>' +
          '<p class="card__sub" style="margin-top:8px">' +
            VTC.esc(VTC.settingsHint(geoErr)) + '</p>' +
          '<button class="btn" id="retry" style="margin-top:12px">Réessayer</button>' +
          '<p class="note" style="text-align:center;padding-top:10px">' +
            'Ou repasse sur <b>Toute l\'IDF</b> juste au-dessus.</p>' +
        '</div>';
      var btn = document.getElementById('retry');
      if (btn) {
        btn.addEventListener('click', function () {
          if (VTC.openAppSettings()) return;      // si un jour l'app sait le faire
          stack.innerHTML = '<div class="skeleton"></div>';
          situer(render);
        });
      }
      return;
    }

    if (local) {
      html += '<p class="note" style="margin:0 0 10px">Dans un rayon de ' +
              VTC.NEAR_KM + ' km autour de toi.</p>';
    }

    /* --- Bloc 1 : la meilleure opportunité dans les 90 prochaines minutes --- */
    var soon = VTC.upcoming(demand, -30, 90).sort(function (a, b) {
      return VTC.score(b) - VTC.score(a);
    });
    var hero = soon[0];

    if (hero) {
      html +=
        '<div class="card card--hero">' +
          '<div class="card__label"><span>Maintenant</span>' +
            '<span>' + VTC.ico(hero.kind) + '</span></div>' +
          '<div class="hero-time">' +
            (VTC.isSortie(hero) ? '<span class="hero-when">sortie</span>' : '') +
            VTC.slotLabel(hero) + '</div>' +
          '<p class="card__title">' + VTC.esc(hero.venue || hero.title) +
            VTC.deptTag(hero.dept) + '</p>' +
          '<p class="card__sub">' + VTC.esc(hero.title) + '</p>' +
          '<p class="card__sub" style="margin-top:8px">' +
            VTC.demandTag(hero.volume) +
            '<span class="countdown" style="margin-left:6px">' + VTC.countdown(hero.start) + '</span>' +
          '</p>' +
          (hero.lat ? VTC.navButtons(hero.lat, hero.lon) : '') +
        '</div>';
    } else {
      html +=
        '<div class="card">' +
          '<div class="card__label">Maintenant</div>' +
          '<p class="card__title">Rien de gros dans l\'heure et demie</p>' +
          '<p class="card__sub">Regarde la suite ci-dessous, ou reste sur tes zones habituelles.</p>' +
        '</div>';
    }

    /* --- Bloc 2 : la suite, hors ce qui est déjà affiché en haut ----------- */
    var later = VTC.upcoming(demand, 60, 420)
      .filter(function (it) { return !hero || it.id !== hero.id; })
      .sort(function (a, b) { return (b.volume || 0) - (a.volume || 0); })
      .slice(0, 2)
      .sort(function (a, b) { return new Date(a.start) - new Date(b.start); });

    if (later.length) {
      html += '<div class="card"><div class="card__label">La suite</div>';
      later.forEach(function (it) {
        html +=
          '<div class="row">' +
            '<div class="row__time">' + VTC.timeCell(it) + '</div>' +
            '<div class="row__body">' +
              '<p class="row__title"><span class="row__name">' +
                VTC.esc(it.venue || it.title) + '</span>' +
                VTC.deptTag(it.dept) + '</p>' +
              '<p class="row__sub"><span class="row__what">' + VTC.esc(it.title) +
                '</span>' + VTC.demandTag(it.volume) + '</p>' +
            '</div>' +
          '</div>';
      });
      html += '</div>';
    }

    /* --- Bloc 3 : le piège à éviter. Disparaît s'il n'y a rien. ------------
       Les fermetures nocturnes courent de 21h à 5h du lundi au vendredi :
       on prévient 3 h à l'avance pour laisser le temps de s'organiser.     */
    /* Ce qui ferme cette nuit passe devant ; faute de quoi — tous les
       week-ends — on montre ce qui est coupé en continu, plutôt que rien. */
    var nuit = VTC.currentNight();
    var ceSoir = VTC.nightClosures(toutesFerm, nuit).filter(function (c) {
      return new Date(c.from).getTime() <= Date.now() + 180 * 60000;
    });
    var clos = ceSoir.length ? ceSoir : VTC.standingClosures(toutesFerm);
    if (clos.length) {
      var c = clos[0];
      var corps =
          '<div class="card__label"><span>Attention</span>' +
            (clos.length > 1 ? '<span class="count">+' + (clos.length - 1) + ' autre' +
              (clos.length > 2 ? 's' : '') + '</span>' : '') + '</div>' +
          '<p class="card__title">' + VTC.esc(c.title) + '</p>' +
          '<p class="card__sub">' + VTC.esc(c.detail || '') + '</p>' +
          '<p class="card__sub" style="margin-top:6px">' +
            '<span class="tag tag--alert">' + VTC.esc(VTC.closureBadge(c)) +
            '</span> ' + VTC.deptTag(c.dept) +
          '</p>';
      /* Un clic mène à la liste complète, dans Sur la route → Trafic : la
         carte n'en montre qu'une, et c'est là que sont les autres.        */
      html += GOTO_TRAFIC
        ? '<a class="card card--alert" id="goTrafic" href="' + GOTO_TRAFIC + '">' +
          corps + '<p class="note" style="text-align:right;padding-top:6px">' +
          'Tout le trafic →</p></a>'
        : '<div class="card card--alert">' + corps + '</div>';
    }

    /* Pas de bouton « Tout voir » : la barre d'onglets est juste en dessous et
       fait déjà ce travail. Le brief tient sur un écran, c'est tout son intérêt.
       Seule la carte rouge reste cliquable, parce qu'elle, elle mène à une
       liste qu'on ne devinerait pas.                                       */

    /* --- Une échéance qui approche ----------------------------------------
       Une ligne, tout en bas, et seulement dans le dernier mois : l'appli ne
       sait pas envoyer de notification, alors c'est le brief qui le dit.
       Les dates sont saisies dans Réglages et ne quittent pas le téléphone. */
    var ech = VTC.echeanceUrgente();
    if (ech) {
      html += '<p class="note" style="text-align:center;padding-top:6px">' +
        (ech.jours < 0
          ? '<b>' + VTC.esc(ech.label) + '</b> a expiré'
          : ech.jours === 0
            ? '<b>' + VTC.esc(ech.label) + '</b> expire aujourd\'hui'
            : '<b>' + VTC.esc(ech.label) + '</b> expire dans ' + ech.jours +
              ' jour' + (ech.jours > 1 ? 's' : '')) +
        ' — à renouveler</p>';
    }

    stack.innerHTML = html;

    var lien = document.getElementById('goTrafic');
    if (lien) {
      lien.addEventListener('click', function (e) {
        if (VTC.go(GOTO_TRAFIC)) e.preventDefault();
      });
    }
  }
})();
</script>
