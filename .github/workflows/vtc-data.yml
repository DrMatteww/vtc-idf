# Régénère les données de l'appli VTC et les publie sur GitHub Pages.
# Le brief tourne tous les quarts d'heure ; les lieux, une fois par semaine,
# parce qu'ils ne bougent quasiment pas.
#
# « Tous les quarts d'heure » est une intention, pas une promesse : le
# planificateur de GitHub est une file d'attente, pas une horloge. Mesuré sur
# ce dépôt même, alors que la ligne disait « minute 7 », les exécutions sont
# parties à 08h40, 07h48, 06h44, 05h32 et 04h47 — entre 25 et 42 minutes de
# retard, et GitHub se réserve le droit d'en sauter quand la charge monte.
# Viser le quart d'heure donne donc une mise à jour toutes les 15 à 45 minutes
# en pratique, au lieu de 60 à 100. À quoi s'ajoutent jusqu'à 10 minutes de
# cache côté Pages (Cache-Control: max-age=600) : inutile de descendre plus
# bas, on paierait des exécutions pour rafraîchir un fichier que le réseau de
# diffusion garde quand même.
#
# Ça ne coûte rien : le dépôt est public, les minutes d'Action y sont
# illimitées, et une exécution dure une trentaine de secondes. Côté sources,
# 96 exécutions par jour font 960 appels SNCF et 64 appels Ticketmaster — la
# billetterie étant gardée six heures en cache, voir TM_CACHE_S.
#
# Ce qui change vraiment d'un quart d'heure à l'autre : les retards de trains.
# La météo est horaire, les fermetures et les événements sont publiés pour la
# journée. L'heure de mise à jour, elle, bougera enfin à l'écran.

name: Données VTC

on:
  schedule:
    - cron: '*/15 * * * *'     # tous les quarts d'heure (UTC) : le brief
    - cron: '20 4 * * 1'       # lundi : les lieux
  workflow_dispatch:            # bouton « Run workflow » pour forcer une mise à jour

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Selon la façon dont les fichiers ont été envoyés sur GitHub, le dossier
      # de l'application se retrouve soit dans « vtc-app/ », soit directement à
      # la racine du dépôt. On regarde où il est au lieu de le supposer : une
      # exécution qui échoue avec « exit code 2 » pour une histoire de chemin
      # est incompréhensible quand on débute.
      - name: Trouver l'application
        id: app
        run: |
          if [ -f vtc-app/scripts/build_data.py ]; then
            echo "dir=vtc-app" >> "$GITHUB_OUTPUT"
            echo "Application trouvée dans vtc-app/"
          elif [ -f scripts/build_data.py ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "Application trouvée à la racine du dépôt"
          else
            echo "::error::scripts/build_data.py est introuvable. Le dépôt doit contenir soit vtc-app/scripts/, soit scripts/. Contenu actuel ci-dessous."
            ls -la
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Le programme de vols d'Air France pèse 80 Mo et ne change que quelques
      # fois par an ; les réponses d'OpenStreetMap et les adresses résolues ne
      # bougent pas non plus d'un jour à l'autre, ni la programmation des
      # salles. On garde tout ça d'une exécution à l'autre : data.gouv répond
      # alors « 304 non modifié » en quelques octets, et les miroirs Overpass
      # ne sont sollicités qu'une fois par semaine.
      #
      # LA CLÉ CHANGE TOUTES LES HEURES, et ce détail fait tout le travail.
      # actions/cache n'enregistre qu'en cas d'échec sur la clé exacte : avec
      # une clé hebdomadaire, tout ce qui était téléchargé après la première
      # exécution de la semaine était jeté à la fin du job, et chaque exécution
      # repartait de la même photo vieillissante — la billetterie était
      # réinterrogée à chaque fois, seize appels pour rien. Avec une clé
      # horaire, la première exécution de l'heure récupère la précédente
      # (restore-keys), travaille, et réenregistre ; les trois suivantes
      # retombent sur la clé exacte et ne redemandent rien à personne. Le
      # dossier pèse 1,2 Mo : vingt-quatre enregistrements par jour ne coûtent
      # rien, et GitHub évince les vieux tout seul.
      - name: Heure courante (clé de cache)
        id: horloge
        run: |
          echo "semaine=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "heure=$(date -u +%Y-%m-%d-%H)" >> "$GITHUB_OUTPUT"

      - name: Cache des sources lourdes
        uses: actions/cache@v4
        with:
          path: ${{ steps.app.outputs.dir }}/scripts/.cache
          key: ssim-${{ steps.horloge.outputs.semaine }}-${{ steps.horloge.outputs.heure }}
          restore-keys: |
            ssim-${{ steps.horloge.outputs.semaine }}-
            ssim-

      # Deux secrets, tous les deux facultatifs et gratuits :
      #   SNCF_TOKEN        fait passer les trains du théorique au temps réel ;
      #   TICKETMASTER_KEY  ajoute la programmation des grandes salles.
      # Sans eux le brief s'écrit quand même, avec moins de contenu. Les vols,
      # les agendas ouverts et les matchs de Ligue 1 ne demandent rien.
      - name: Brief (trains, vols, événements, fermetures, météo)
        env:
          SNCF_TOKEN: ${{ secrets.SNCF_TOKEN }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
        run: python3 ${{ steps.app.outputs.dir }}/scripts/build_data.py --out public/data --only brief

      # Toilettes, fast-foods de nuit, astuces et communes. Une fois par
      # semaine : OpenStreetMap ne bouge pas d'un jour à l'autre, et les
      # miroirs Overpass sont tenus par des bénévoles.
      - name: Lieux (hebdomadaire)
        if: github.event.schedule == '20 4 * * 1' || github.event_name == 'workflow_dispatch'
        run: python3 ${{ steps.app.outputs.dir }}/scripts/build_data.py --out public/data --only lieux

      - name: Copier la feuille de style et le script
        run: cp ${{ steps.app.outputs.dir }}/cdn/app.css ${{ steps.app.outputs.dir }}/cdn/app.js public/

      # Le back office est servi par la même Pages que les données. Il est
      # public — c'est une page statique — mais il ne peut RIEN faire sans
      # jeton : la serrure est le jeton, pas l'adresse.
      - name: Copier le back office
        run: |
          if [ -d backoffice ]; then
            mkdir -p public/backoffice
            cp -r backoffice/. public/backoffice/
          fi

      - name: Publier
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true        # garde les fichiers hebdomadaires entre deux runs horaires
